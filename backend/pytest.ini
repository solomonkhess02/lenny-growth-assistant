[pytest]
testpaths = tests
asyncio_mode = auto
# asyncpg connections are bound to the event loop that created them. With
# per-test loops a session-scoped engine hands out connections from a dead
# loop -> "got result for unknown protocol state". One loop for everything.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
addopts = -q --strict-markers
filterwarnings =
    ignore::DeprecationWarning
